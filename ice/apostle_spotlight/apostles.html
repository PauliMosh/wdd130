<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>12 Apostles</title>
    <style>
        body {
            background-color: #e8eced;
            color: #e8eced;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            padding: 40px 0;
        }
        #card {
            background-image: url(images/christus.webp);
            background-size: cover;
            background-position: center;
            width: 900px;
            border-radius: 30px;
            border: 7px solid black;
            padding: 20px 0 40px 0;
            box-shadow: 0 0 25px rgba(0,0,0,0.4);
            color: white;
            text-shadow: 0 0 8px black;
        }
        .first-presidency {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            width: 60%;
            margin: 0 auto;
        }
        .quorum-of-twelve {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            width: 70%;
            margin: 0 auto;

        }
        a {
            text-decoration: 0;
            color:#e8eced;
            font-family: Arial, sans-serif;
        }
        h1 {
            font-size: 3em;
            text-align: center;
            margin-top: 0px;
            margin-bottom: 10px;
        }
        h2 {
            font-size: 1.8em;
            text-align: center;
            margin-top: 25px;
            margin-bottom: 15px;

        }
        img{
            border: 6px solid #e8eced;
            height: 6em;
            width: 6em;
            object-fit: cover;
            border-radius: 50%;
            margin: 0 auto;
            display: block;
        }
        img:hover {
            transition: transform .5s;
            transform: scale(1.1);  
            box-shadow: 0 0 10px black;
        }
        #eyring-image {
            height: 7em;
            width: 7em;
        }

        #oaks-image {
            height: 9em;
            width: 9em;
        }

        #christofferson-image {
            height: 7em;
            width: 7em;
        }

    </style>
</head>
<body>
    <div id="card">
        <a href="https://www.churchofjesuschrist.org/learn/first-presidency?lang=eng">
            <h1>First Presidency</h1>
        </a>
        <div class="first-presidency">
            <a href="https://www.churchofjesuschrist.org/learn/henry-b-eyring?lang=eng">
                <img src="images/eyring.webp" alt="Elder Henry B. Eyring" id="eyring-image">
            </a>
            <a href="https://www.churchofjesuschrist.org/learn/dallin-h-oaks?lang=eng">
                <img src="images/oaks.webp" alt="President Dallin H. Oaks" id="oaks-image">
            </a>
            <a href="https://www.churchofjesuschrist.org/learn/d-todd-christofferson?lang=eng">
                <img src="images/christofferson.webp" alt="Elder D. Todd Christofferson" id="christofferson-image">
            </a>
        </div>
        <a href="https://www.churchofjesuschrist.org/learn/quorum-of-the-twelve-apostles?lang=eng">
            <h2>Quorum of the Twelve Apostles</h2>
        </a>
        <div class="quorum-of-twelve">
            <a href="https://www.churchofjesuschrist.org/learn/dieter-f-uchtdorf?lang=eng">
                <img src="images/uchtdorf.webp" alt="Elder Dieter F. Uchtdorf">
            </a>
            <a href="https://www.churchofjesuschrist.org/learn/david-a-bednar?lang=eng">
                <img src="images/bednar.webp" alt="Elder David A. Bednar">
            </a>
            <a href="https://www.churchofjesuschrist.org/learn/quentin-l-cook?lang=eng">
                <img src="images/cook.webp" alt="Elder Quentin L. Cook">
            </a>
            <a href="https://www.churchofjesuschrist.org/learn/neil-l-andersen?lang=eng">
                <img src="images/anderson.webp" alt="Elder Neil L. Andersen">
            </a>
            <a href="https://www.churchofjesuschrist.org/learn/ronald-a-rasband?lang=eng">
                <img src="images/rasband.webp" alt="Elder Ronald A. Rasband">
            </a>
            <a href="https://www.churchofjesuschrist.org/learn/gary-e-stevenson?lang=eng">
                <img src="images/stevenson.webp" alt="Elder Gary E. Stevenson">
            </a>
            <a href="https://www.churchofjesuschrist.org/learn/dale-g-renlund?lang=eng">
                <img src="images/renlund.webp" alt="Elder Dale G. Renlund">
            </a>
            <a href="https://www.churchofjesuschrist.org/learn/gerrit-w-gong?lang=eng">
                <img src="images/gong.webp" alt="Elder Gerrit W. Gong">
            </a>
            <a href="https://www.churchofjesuschrist.org/learn/ulisses-soares?lang=eng">
                <img src="images/soares.webp" alt="Elder Ulisses Soares">
            </a>
            <a href="https://www.churchofjesuschrist.org/learn/patrick-kearon?lang=eng">
                <img src="images/kearon.webp" alt="Elder Patrick Kearon">
            </a>
            <a href="https://www.churchofjesuschrist.org/learn/gerald-j-causse?lang=eng">
                <img src="images/causse.webp" alt="Gérald Caussé">
            </a>
            <a href="https://www.churchofjesuschrist.org/learn/clark-g-gilbert?lang=eng">
                <img src="images/gilbert.webp" alt="Elder Clark G. Gilbert">
            </a>
        </div>
    </div>
</body>
</html>
