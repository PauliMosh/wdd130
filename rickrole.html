
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YOU GOT RICKROLLED!</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    overflow-x: hidden;
    font-family: Arial, sans-serif;
    text-align: center;
    color: white;

    background: linear-gradient(
        45deg,
        red, orange, yellow, green,
        cyan, blue, purple, red
    );
    background-size: 400% 400%;
    animation: rainbow 5s ease infinite;
}

@keyframes rainbow {
    0% {background-position: 0% 50%;}
    50% {background-position: 100% 50%;}
    100% {background-position: 0% 50%;}
}

h1 {
    font-size: clamp(35px, 8vw, 85px);
    margin-top: 35px;
    text-shadow: 5px 5px 5px black;
    animation: bounce 0.7s infinite alternate;
}

@keyframes bounce {
    from {transform: translateY(0) rotate(-3deg);}
    to {transform: translateY(-20px) rotate(3deg);}
}

.subtitle {
    font-size: 25px;
    font-weight: bold;
    text-shadow: 3px 3px black;
    animation: spin 4s linear infinite;
}

@keyframes spin {
    0% {transform: rotate(-3deg);}
    50% {transform: rotate(3deg);}
    100% {transform: rotate(-3deg);}
}

button {
    padding: 20px 35px;
    font-size: 25px;
    font-weight: bold;
    color: white;
    background: #ff1493;
    border: 4px solid white;
    border-radius: 20px;
    cursor: pointer;
    box-shadow: 0 0 20px black;
    animation: pulse 1s infinite alternate;
}

@keyframes pulse {
    from {transform: scale(1);}
    to {transform: scale(1.12);}
}

button:hover {
    background: red;
}


#video {
    display: block;
    margin: 30px auto;
    width: min(90%, 700px);
}

iframe {
    width: 100%;
    height: 100%;
    border: none;
    border-radius: 14px;
}

.floating {
    position: fixed;
    bottom: -50px;
    font-size: 40px;
    animation: floatUp 5s linear infinite;
    pointer-events: none;
    z-index: 5;
}

@keyframes floatUp {
    from {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
    }
    to {
        transform: translateY(-110vh) rotate(720deg);
        opacity: 0;
    }
}

#message {
    display: none;
    font-size: 35px;
    font-weight: bold;
    text-shadow: 4px 4px black;
    animation: bounce 0.5s infinite alternate;
}
</style>
</head>

<body>

<h1>YOU'VE BEEN RICKROLLED!</h1>

<p class="subtitle">
🎉 NEVER GONNA GIVE YOU UP 🎉
</p>

<h2>Think you can escape? Think again.</h2>

<button onclick="rickroll()">
😈 CLICK TO GET RICKROLLED 😈
</button>

<div id="message">
WELCOME TO THE RICKROLL ZONE 💀
</div>

<div id="video">
    <video controls width="600">
        <source src="your-video-file.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
</div>

<script>
function rickroll() {

    document.querySelector("button").style.display = "none";

    document.getElementById("message").style.display = "block";

    document.getElementById("video").style.display = "block";


    // Create endless floating emojis
    setInterval(() => {

        const emoji = document.createElement("div");

        emoji.className = "floating";

        const emojis = ["💀", "🕺", "🎉", "🔥", "😂", "🌈"];

        emoji.innerHTML =
            emojis[Math.floor(Math.random() * emojis.length)];

        emoji.style.left = Math.random() * 100 + "vw";

        document.body.appendChild(emoji);

        setTimeout(() => emoji.remove(), 5000);

    }, 250);
}
</script>

</body>
</html>
